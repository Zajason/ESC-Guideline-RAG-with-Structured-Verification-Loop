name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run public unit tests
        run: python -m unittest discover -s tests
      - name: Run synthetic demo
        run: python scripts/run_demo.py
